<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorry Message</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      animation: fadeIn 2s ease;
      max-width: 400px;
    }

    .card h1 {
      font-size: 2rem;
      color: #ff6b6b;
      margin-bottom: 20px;
    }

    .card p {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 20px;
    }

    .heart {
      color: #ff6b6b;
      font-size: 3rem;
      animation: beat 1s infinite;
    }

    .button {
      background: #ff6b6b;
      color: white;
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .button:hover {
      background: #ff4a4a;
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>I'm Sorry simmi🥺</h1>
    <p>I never meant to hurt you. You're my best friend, and your happiness means the world to me. Please forgive me? ❤️</p>
    <div class="heart">❤️</div>
    <button class="button" onclick="showMessage()">Click if you forgive me</button>
  </div>

  <script>
    function showMessage() {
      alert("Thank you for forgiving me! Let's always stay best friends! ❤️");
    }
  </script>
</body>
</html>
